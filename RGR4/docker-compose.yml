services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-events_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-events_security}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-events_user}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-events_security}
      SECRET_KEY: ${SECRET_KEY:-local-compose-secret-change-before-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  backup:
    image: postgres:15-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-events_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATABASE: ${POSTGRES_DB:-events_security}
    volumes:
      - ./backups:/backups
    entrypoint: |
      /bin/sh -c '
      mkdir -p /backups
      echo "Служба автоматического резервного копирования запущена."
      while true; do
        FILENAME="/backups/backup_$$(date +\%Y\%m\%d_\%H\%M\%S).sql.gz"
        echo "[Backup] Создание резервной копии: $$FILENAME"
        pg_dump | gzip > "$$FILENAME"
        # Ротация: хранить дампы за последние 7 дней (удалять старше 7 суток)
        find /backups -type f -name "backup_*.sql.gz" -mtime +7 -delete
        echo "[Backup] Резервная копия успешно создана. Следующий запуск через 24 часа."
        sleep 86400
      done
      '

volumes:
  postgres_data: